model_list:
  # Business code only ever uses the alias `default-llm`; the real model is chosen here.
  - model_name: default-llm
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30

litellm_settings:
  # Timeout budget (callers must wait longer than this, or LiteLLM keeps retrying and billing
  # after the caller has given up): (num_retries + 1) x timeout = 60 s worst case.
  #   LiteLLM 60 s  <  Python llm_timeout_s 70 s  <  Nest LLM_TIMEOUT_MS 80 s
  num_retries: 1
  request_timeout: 30
  drop_params: true
  # Client documents are confidential: keep cost, tokens and metadata in the spend log,
  # but do not store prompts or responses in LiteLLM's database.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

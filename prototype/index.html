<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Copilot — design prototype</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div id="app"></div>
<div class="devbar" role="toolbar" aria-label="Prototype controls">
  <span class="lbl">Theme</span>
  <div class="seg" data-ctl="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  <span class="lbl">State</span>
  <div class="seg" data-ctl="state"><button data-v="full">Full</button><button data-v="loading">Loading</button><button data-v="empty">Empty</button><button data-v="error">Error</button></div>
  <span class="lbl">Analysis</span>
  <div class="seg" data-ctl="run"><button data-v="none">Not run</button><button data-v="running">Running</button><button data-v="failed">Failed</button><button data-v="done">Done</button></div>
</div>
<script src="analysis.js"></script><!-- feature code first: it only defines things; prototype.js renders -->
<script src="prototype.js"></script>
</body>
</html>

[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer>=3.5.2",
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
